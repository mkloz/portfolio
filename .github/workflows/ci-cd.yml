name: Portfolio CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Cloudflare Pages environment to deploy
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production

concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release gate
        run: npm run check:release

      - name: Upload verified Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-pages-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  preview:
    name: Deploy preview
    needs: build
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - name: Checkout deployment checks
        uses: actions/checkout@v6

      - name: Download verified Pages artifact
        uses: actions/download-artifact@v5
        with:
          name: portfolio-pages-${{ github.sha }}
          path: dist

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: 4.123.0
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'mkloz-portfolio' }}
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}

      - name: Smoke test preview
        run: node scripts/deployment/smoke.mjs "${{ steps.deploy.outputs.deployment-url }}"

  production:
    name: Deploy production
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - name: Checkout deployment checks
        uses: actions/checkout@v6

      - name: Download verified Pages artifact
        uses: actions/download-artifact@v5
        with:
          name: portfolio-pages-${{ github.sha }}
          path: dist

      - name: Deploy production to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: 4.123.0
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'mkloz-portfolio' }}
            --branch=main
            --commit-hash=${{ github.sha }}

      - name: Smoke test production deployment
        run: node scripts/deployment/smoke.mjs "${{ steps.deploy.outputs.deployment-url }}"
